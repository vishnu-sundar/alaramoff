name: Android APK and alarm tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleQa :clock-fixture:assembleDebug :clock-fixture:assembleDebugAndroidTest
      - name: Check APK signature and package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AlarmOff-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/AlarmOff-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AlarmOff-debug.apk | head -n 4 || test "${PIPESTATUS[0]}" = 141
          cd dist && sha256sum AlarmOff-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AlarmOff-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-inputs
          path: |
            app/build/outputs/apk/qa/app-qa.apk
            clock-fixture/build/outputs/apk/debug/clock-fixture-debug.apk
            clock-fixture/build/outputs/apk/androidTest/debug/clock-fixture-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-inputs
          path: .
      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check foreground access, bulk actions and widget on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python3 testing/device_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-api-${{ matrix.api }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
